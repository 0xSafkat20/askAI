name: Deploy to Cloudflare
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Configure Supabase runtime
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const { SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY } = process.env;
          if (!SUPABASE_URL || !SUPABASE_PUBLISHABLE_KEY) throw new Error('Set Supabase repository secrets before deploying.');
          if (!SUPABASE_PUBLISHABLE_KEY.startsWith('sb_publishable_')) {
            let role;
            try { role = JSON.parse(Buffer.from(SUPABASE_PUBLISHABLE_KEY.split('.')[1], 'base64url')).role; } catch {}
            if (role !== 'anon') throw new Error('Only a publishable or legacy anon key is allowed.');
          }
          const path = 'dist/server/wrangler.json';
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));
          config.vars = { ...config.vars, SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY };
          fs.writeFileSync(path, JSON.stringify(config, null, 2));
          NODE
      # Apply supabase/migrations SQL to Supabase before this workflow.
      - name: Deploy worker
        run: npx wrangler deploy --config dist/server/wrangler.json
      - name: Set optional Gemini secret
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            printf '%s' "$GEMINI_API_KEY" | npx wrangler secret put GEMINI_API_KEY --config dist/server/wrangler.json
          fi
